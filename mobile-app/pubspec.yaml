name: preps233_learn
description: Offline-first WASSCE preparation — Preps233
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Auth + cloud sync
  supabase_flutter: ^2.3.4

  # Local database (SQLite — works on Android and Windows)
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3+1   # required for Windows / Linux

  # File paths
  path_provider: ^2.1.2
  path: ^1.9.0

  # Cross-platform video player (Android + Windows via libmpv)
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4   # pre-built native libs

  # Downloading video files with progress
  dio: ^5.4.0

  # Misc
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
